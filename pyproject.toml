[project]
name = "delivery-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Arthur290795",email = "arturche_k@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "celery (>=5.6.3,<6.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "qdrant-client (>=1.19.1,<2.0.0)",
    "openai (>=3.23.0,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "yandex-ai-studio-sdk (>=0.22.1,<0.23.0)",
    "pymongo (>=4.18.2,<5.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
]
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "app"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
# Набор правил: базовые ошибки/предупреждения + сортировка импортов + апгрейды и упрощения
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP042", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"     # "double" | "single"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.6
      hooks:
        - id: ruff-check
        - id: ruff-format
    - repo: local
      hooks:
        - id: mypy
          name: type check
          entry: poetry run mypy app
          language: system
          pass_filenames: false

        - id: tests
          name: Run tests
          entry: poetry run pytest
          language: system
          pass_filenames: false

        - id: bandit
          name: Security check
          entry: poetry run bandit -r app
          language: system
          pass_filenames: false
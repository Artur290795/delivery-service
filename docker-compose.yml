services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: delivery_service
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8
    ports:
      - "6379:6379"
volumes:
  postgres_data: